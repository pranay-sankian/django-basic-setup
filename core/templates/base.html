<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Django App{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- Navbar (optional but recommended) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">MyApp</a>

        <div class="ms-auto">
          {% if user.is_authenticated %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}"
            >Logout</a
          >
          {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}"
            >Login</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Page content -->
    <div class="container mt-5">{% block content %}{% endblock %}</div>
  </body>
</html>
